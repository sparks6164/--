<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leg的小站</title>
    <!-- 思源黑体 (Noto Sans SC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局重置 ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', '思源黑体', 'Source Han Sans SC', sans-serif;
            /* 柔和渐变背景 */
            background: linear-gradient(135deg, #fef9f0 0%, #fdf2f5 25%, #f3f0ff 50%, #eef4ff 75%, #f0faf5 100%);
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 背景装饰光斑 ===== */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 182, 140, 0.30) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(167, 180, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 页面容器 ===== */
        .site-wrapper {
            position: relative;
            z-index: 1;
            border: 1px solid #cccccc;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(2px);
            min-height: 100vh;
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.5),
                        0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* ===== 右上角导航 ===== */
        .nav-area {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        /* ===== 按钮通用样式 ===== */
        .nav-btn {
            font-family: 'Noto Sans SC', '思源黑体', 'Source Han Sans SC', sans-serif;
            font-size: 16px;
            border-radius: 6px;
            padding: 8px 20px;
            cursor: pointer;
            animation: fadeInOut 3s ease-in-out infinite;
            transition: box-shadow 0.3s ease, transform 0.3s ease, background 0.3s ease;
            white-space: nowrap;
            border: none;
            font-weight: 500;
        }

        /* --- 首页按钮：暖珊瑚色 --- */
        .nav-btn:nth-child(1) {
            background: linear-gradient(135deg, #ff8a7a, #ff6b5b);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 107, 91, 0.35);
            animation-delay: 0s;
        }
        .nav-btn:nth-child(1):hover {
            background: linear-gradient(135deg, #ff9b8d, #ff7d6f);
            box-shadow: 0 6px 18px rgba(255, 107, 91, 0.50);
            transform: translateY(-2px);
        }
        .nav-btn:nth-child(1):active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(255, 107, 91, 0.30);
        }

        /* --- 功能按钮：青碧色 --- */
        .nav-btn:nth-child(2) {
            background: linear-gradient(135deg, #5ec4b0, #3dab93);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(61, 171, 147, 0.35);
            animation-delay: 0.5s;
        }
        .nav-btn:nth-child(2):hover {
            background: linear-gradient(135deg, #72d0be, #50b8a1);
            box-shadow: 0 6px 18px rgba(61, 171, 147, 0.50);
            transform: translateY(-2px);
        }
        .nav-btn:nth-child(2):active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(61, 171, 147, 0.30);
        }

        /* --- 关于按钮：柔紫罗兰色 --- */
        .nav-btn:nth-child(3) {
            background: linear-gradient(135deg, #a78bfa, #8b6fe0);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(139, 111, 224, 0.35);
            animation-delay: 1s;
        }
        .nav-btn:nth-child(3):hover {
            background: linear-gradient(135deg, #b9a3fb, #9d84ec);
            box-shadow: 0 6px 18px rgba(139, 111, 224, 0.50);
            transform: translateY(-2px);
        }
        .nav-btn:nth-child(3):active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(139, 111, 224, 0.30);
        }

        /* ===== 淡入淡出动画 ===== */
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        /* ================================================ */
        /*  中心区域                                          */
        /* ================================================ */
        .center-section {
            /* 浅色调背景 A — 暖奶油白 */
            background-color: #fefcf8;
            padding: 100px 40px 60px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主体大字 */
        .main-text {
            font-family: 'Noto Sans SC', '思源黑体', 'Source Han Sans SC', sans-serif;
            font-size: 50px;
            color: #000000;
            text-align: center;
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.8),
                0 2px 3px rgba(0, 0, 0, 0.12),
                0 4px 8px rgba(0, 0, 0, 0.10),
                0 8px 16px rgba(0, 0, 0, 0.08),
                0 12px 24px rgba(0, 0, 0, 0.06);
            font-weight: 700;
            letter-spacing: 4px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        /* 对话框（输入框） */
        .dialog-box {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 10px;
            padding: 16px 20px;
            font-family: 'Noto Sans SC', '思源黑体', 'Source Han Sans SC', sans-serif;
            font-size: 18px;
            color: #333333;
            /* 阴影：灰色，10px */
            box-shadow: 0 4px 10px rgba(128, 128, 128, 0.30);
            resize: vertical;
            min-height: 60px;
            line-height: 1.6;
            outline: none;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .dialog-box:focus {
            border-color: #a78bfa;
            box-shadow: 0 4px 14px rgba(128, 128, 128, 0.40);
        }

        /* 对话框按钮区 */
        .dialog-buttons {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }

        .dialog-btn {
            font-family: 'Noto Sans SC', '思源黑体', 'Source Han Sans SC', sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        /* 发送按钮 */
        .btn-send {
            background: linear-gradient(135deg, #5ec4b0, #3dab93);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(61, 171, 147, 0.30);
        }
        .btn-send:hover {
            background: linear-gradient(135deg, #72d0be, #50b8a1);
            box-shadow: 0 6px 16px rgba(61, 171, 147, 0.45);
            transform: translateY(-2px);
        }
        .btn-send:active {
            transform: translateY(0);
        }

        /* 清空按钮 */
        .btn-clear {
            background: linear-gradient(135deg, #e0e0e0, #cccccc);
            color: #555555;
            box-shadow: 0 4px 10px rgba(128, 128, 128, 0.25);
        }
        .btn-clear:hover {
            background: linear-gradient(135deg, #ececec, #d8d8d8);
            box-shadow: 0 6px 16px rgba(128, 128, 128, 0.40);
            transform: translateY(-2px);
        }
        .btn-clear:active {
            transform: translateY(0);
        }

        /* ================================================ */
        /*  玩法区                                            */
        /* ================================================ */
        .play-section {
            /* 浅色调背景 B — 淡薰衣草灰 */
            background-color: #f5f3fa;
            padding: 50px 40px;
            text-align: center;
        }

        .play-section .section-label {
            font-size: 18px;
            color: #888888;
            margin-bottom: 28px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .play-grid {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        /* 圆角正方形卡片 */
        .play-card {
            width: 150px;
            height: 150px;
            background-color: #ffffff;
            border: 1px solid #e0dde8;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #444444;
            padding: 12px;
            line-height: 1.5;
            box-shadow: 0 3px 10px rgba(128, 128, 128, 0.12);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            user-select: none;
        }

        .play-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(128, 128, 128, 0.20);
            border-color: #c5bfd6;
        }

        /* 每个卡片不同的强调色（左侧细条用 box-shadow inset 模拟） */
        .play-card:nth-child(1) { border-top: 3px solid #ff8a7a; }
        .play-card:nth-child(2) { border-top: 3px solid #5ec4b0; }
        .play-card:nth-child(3) { border-top: 3px solid #6db3f2; }
        .play-card:nth-child(4) { border-top: 3px solid #a78bfa; }

        /* ================================================ */
        /*  版权信息区                                        */
        /* ================================================ */
        .copyright-section {
            background-color: #f5f3fa;
            text-align: center;
            padding: 10px 40px 16px 40px;
        }

        .copyright-text {
            font-size: 14px;
            color: #999999;
            letter-spacing: 1px;
        }

        /* ================================================ */
        /*  友情链接区                                        */
        /* ================================================ */
        .links-section {
            background-color: #f5f3fa;
            text-align: center;
            padding: 0 40px 40px 40px;
        }

        .links-text {
            font-size: 14px;
            color: #999999;
            letter-spacing: 1px;
        }

        .links-text a {
            color: #8b6fe0;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links-text a:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        /* ================================================ */
        /*  响应式设计                                        */
        /* ================================================ */

        /* 平板及以下 */
        @media (max-width: 768px) {
            .site-wrapper {
                border-radius: 0;
            }

            .nav-area {
                position: static;
                justify-content: center;
                padding: 16px 0 0 0;
                gap: 8px;
            }

            .nav-btn {
                font-size: 14px;
                padding: 6px 14px;
            }

            .nav-btn:nth-child(1) { box-shadow: 0 3px 8px rgba(255, 107, 91, 0.35); }
            .nav-btn:nth-child(2) { box-shadow: 0 3px 8px rgba(61, 171, 147, 0.35); }
            .nav-btn:nth-child(3) { box-shadow: 0 3px 8px rgba(139, 111, 224, 0.35); }

            .center-section {
                padding: 60px 20px 40px 20px;
            }

            .main-text {
                font-size: 32px;
                letter-spacing: 2px;
                margin-bottom: 28px;
                text-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.8),
                    0 2px 3px rgba(0, 0, 0, 0.12),
                    0 4px 8px rgba(0, 0, 0, 0.10),
                    0 6px 12px rgba(0, 0, 0, 0.06);
            }

            .dialog-box {
                font-size: 16px;
                padding: 12px 16px;
            }

            .dialog-btn {
                font-size: 14px;
                padding: 8px 20px;
            }

            .play-section {
                padding: 36px 20px;
            }

            .play-card {
                width: 120px;
                height: 120px;
                font-size: 14px;
                border-radius: 14px;
            }

            .play-grid {
                gap: 14px;
            }
        }

        /* 手机 */
        @media (max-width: 480px) {
            .center-section {
                padding: 50px 12px 32px 12px;
            }

            .main-text {
                font-size: 24px;
                letter-spacing: 1px;
                margin-bottom: 22px;
                text-shadow:
                    0 1px 0 rgba(255, 255, 255, 0.8),
                    0 2px 3px rgba(0, 0, 0, 0.10),
                    0 3px 6px rgba(0, 0, 0, 0.08),
                    0 5px 10px rgba(0, 0, 0, 0.05);
            }

            .dialog-box {
                font-size: 15px;
                padding: 10px 14px;
                border-radius: 8px;
            }

            .dialog-buttons {
                gap: 8px;
            }

            .dialog-btn {
                font-size: 13px;
                padding: 7px 16px;
            }

            .nav-btn {
                font-size: 13px;
                padding: 5px 10px;
                border-radius: 4px;
            }

            .nav-btn:nth-child(1) { box-shadow: 0 2px 6px rgba(255, 107, 91, 0.35); }
            .nav-btn:nth-child(2) { box-shadow: 0 2px 6px rgba(61, 171, 147, 0.35); }
            .nav-btn:nth-child(3) { box-shadow: 0 2px 6px rgba(139, 111, 224, 0.35); }

            .play-section {
                padding: 28px 12px;
            }

            .play-grid {
                gap: 10px;
            }

            .play-card {
                width: 70px;
                height: 70px;
                font-size: 11px;
                border-radius: 12px;
                padding: 6px;
            }

            .copyright-section {
                padding: 8px 16px 12px 16px;
            }

            .links-section {
                padding: 0 16px 28px 16px;
            }

            .copyright-text,
            .links-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <!-- 右上角导航 -->
        <nav class="nav-area">
            <button class="nav-btn" onclick="navigate('home')">首页</button>
            <button class="nav-btn" onclick="navigate('features')">功能</button>
            <button class="nav-btn" onclick="navigate('about')">关于</button>
        </nav>

        <!-- ============ 中心区域 ============ -->
        <section class="center-section">
            <!-- 主体大字 -->
            <h1 class="main-text">你好，这里是leg的小站</h1>

            <!-- 对话框 -->
            <textarea
                class="dialog-box"
                id="dialogInput"
                rows="2"
                placeholder="输入你想说的话..."
            >hello world！</textarea>

            <!-- 发送 / 清空 按钮 -->
            <div class="dialog-buttons">
                <button class="dialog-btn btn-send" onclick="sendMessage()">发送</button>
                <button class="dialog-btn btn-clear" onclick="clearMessage()">清空</button>
            </div>
        </section>

        <!-- ============ 玩法区 ============ -->
        <section class="play-section">
            <p class="section-label">— 玩法 —</p>
            <div class="play-grid">
                <div class="play-card" onclick="openGame('minesweeper')">扫雷</div>
                <div class="play-card" onclick="openGame('running')">上伊那牡丹快跑</div>
                <div class="play-card" onclick="openGame('maimai')">舞萌dx</div>
                <div class="play-card" onclick="openGame('bot')">调戏bot</div>
            </div>
        </section>

        <!-- ============ 版权信息区 ============ -->
        <section class="copyright-section">
            <p class="copyright-text">版权所有，转载请注明出处</p>
        </section>

        <!-- ============ 友情链接区 ============ -->
        <section class="links-section">
            <p class="links-text">
                友情链接：
                <a href="#">xxx</a>、
                <a href="#">xxx</a>、
                <a href="#">xxx</a>
            </p>
        </section>
    </div>

    <script>
        /**
         * 导航按钮点击
         */
        function navigate(page) {
            console.log(`导航至: ${page}`);
        }

        /**
         * 发送消息
         */
        function sendMessage() {
            const input = document.getElementById('dialogInput');
            const message = input.value.trim();
            if (message) {
                alert('📨 已发送: ' + message);
            } else {
                alert('⚠️ 请输入内容后再发送');
            }
        }

        /**
         * 清空消息
         */
        function clearMessage() {
            const input = document.getElementById('dialogInput');
            input.value = '';
            input.focus();
        }

        /**
         * 玩法卡片点击
         */
        function openGame(game) {
            const names = {
                minesweeper: '扫雷 🏴',
                running: '上伊那牡丹快跑 🏃',
                maimai: '舞萌dx 🎵',
                bot: '调戏bot 🤖'
            };
            console.log(`打开游戏: ${game}`);
            alert('即将上线: ' + (names[game] || game));
        }
    </script>
</body>
</html>
